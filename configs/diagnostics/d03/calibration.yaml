# D03 v2 calibration. Core algorithm and severity semantics remain frozen.
population: 100
neighborhood: 20
neighbor_probability: 0.90
replacement_cap: 2
generations: 15
method: full
controller: qlearning
budget_policy: fixed
fixed_budget: 6
trigger_mode: preference
rl_steps: 5
alpha: 0.30
gamma: 0.70
epsilon_start: 0.30
epsilon_end: 0.05
stagnation_threshold: 5
severity_thresholds: [0.20, 0.20, 0.20, 0.20, 0.20, 0.20]
polish: true
instance: instances/diagnostic_d03/calibration/placeholder.json
output: outputs/diagnostics/d03/calibration
